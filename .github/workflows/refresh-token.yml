name: 續期 Threads token

# Threads 長效 token 只有 60 天，過期後會無聲無息停止運作。
# 每月 1 號續一次，永遠碰不到期限。
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取得新 token 並寫回 Secret
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 需要一顆對本 repo 有 Secrets: read and write 權限的 fine-grained PAT
          GH_TOKEN: ${{ secrets.SECRET_UPDATER_PAT }}
        run: |
          NEW_TOKEN=$(python3 refresh_token.py)
          if [ -z "$NEW_TOKEN" ]; then
            echo "沒拿到新 token，中止" >&2
            exit 1
          fi
          printf '%s' "$NEW_TOKEN" | gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "THREADS_ACCESS_TOKEN 已更新"
